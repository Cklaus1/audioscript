# AudioScript configuration
# Run `audioscript init` for guided setup, or `audioscript check` to verify.

# Core settings
output_dir: "./output"
tier: "draft"                    # draft (fast), balanced (turbo), high_quality (large-v3)

# LLM analysis — LOCAL AI ONLY (owner decision 2026-10-12): transcripts must never go to a
# cloud provider (anthropic / nim). Summaries run on the on-box vLLM server (op-stack).
# Without these lines AudioScript falls back to llm_provider "anthropic".
llm_provider: "openai"                      # OpenAI-compatible protocol, served locally
llm_base_url: "http://localhost:11435/v1"   # on-box vLLM
llm_model: "Qwen/Qwen3.5-4B"

# Speaker diarization — set HF_TOKEN env var to enable
# diarize: true

# Sync — auto-transcribe new audio files from watched directories
# sync:
#   sources:
#     - path: "C:\\Users\\yourname\\OneDrive\\Documents\\Sound Recordings"
#       tier: balanced
#       diarize: true
#   output_dir: "./transcripts/sync"
#   output_format: markdown
#   minotes:
#     enabled: false
#     folder: "Transcripts"
